<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="50%" stop-color="#e8c96a"/>
      <stop offset="100%" stop-color="#b8912e"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5090"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>

  <!-- Icon area -->
  <g transform="translate(60,60)">
    <!-- Speech bubble -->
    <path d="M-40,-30 v-6 a9,9 0 0,1 9,-9 h62 a9,9 0 0,1 9,9 v48 a9,9 0 0,1 -9,9 h-50 l-14,14 v-14 h-8 a9,9 0 0,1 -9,-9 v-37" 
          fill="url(#bubbleGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.2"/>

    <!-- Inner speech lines -->
    <g opacity="0.25" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round">
      <line x1="-22" y1="-12" x2="22" y2="-12"/>
      <line x1="-22" y1="-4" x2="14" y2="-4"/>
      <line x1="-22" y1="4" x2="18" y2="4"/>
    </g>

    <!-- 信 - 人 -->
    <g transform="translate(-16,1)" fill="none" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,-24 v20 c0,4 3,8 6,12"/>
      <path d="M-9,-12 c-3,-3 -2,-12 0,-15 c1,3 3,12 0,15"/>
    </g>

    <!-- 信 - 言 -->
    <g transform="translate(7,1)" fill="none" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-11" y1="-22" x2="11" y2="-22"/>
      <line x1="-14" y1="-13" x2="14" y2="-13"/>
      <line x1="-12" y1="-4" x2="12" y2="-4"/>
      <rect x="-6" y="5" width="15" height="12" rx="2"/>
    </g>

    <!-- Diamond accent -->
    <polygon points="55,-35 63,-28 55,-21 47,-28" fill="url(#goldGrad)" opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(160,60)">
    <!-- 元信 -->
    <text x="0" y="5" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="36" font-weight="700" fill="#0d2b45" letter-spacing="8">元信</text>
    <!-- Divider line -->
    <line x1="0" y1="22" x2="110" y2="22" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- YUANXIN -->
    <text x="0" y="42" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#8899aa" letter-spacing="4">YUANXIN</text>
  </g>

  <!-- Slogan -->
  <g transform="translate(350,60)">
    <text x="0" y="-30" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#8899aa" text-anchor="end">国元之心</text>
    <line x1="-72" y1="-22" x2="0" y2="-22" stroke="#c4a44a" stroke-width="0.6" opacity="0.5"/>
    <text x="0" y="-8" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#8899aa" text-anchor="end">融汇于信</text>
  </g>
</svg>
