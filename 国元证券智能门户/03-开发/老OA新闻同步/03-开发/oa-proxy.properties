# ===========================================================
# OA新闻代理配置文件
# 部署位置：/opt/oa-news-proxy/oa-proxy.properties
# 权限：chmod 600（仅root可读）
# ===========================================================

# --- OA认证 ---
oa.base.url=http://home.oa.gyzq.com
oa.username=请填写OA服务账号
oa.password=请填写密码
# 认证方式：cookie_form（表单认证）或 ntlm（Windows集成认证）
oa.auth.type=cookie_form

# --- 代理服务 ---
proxy.listen.host=127.0.0.1
proxy.listen.port=8899

# --- 会话管理 ---
# Cookie最长有效期（小时），超过后自动重新登录
session.cookie.max.age.hours=4
# 登录失败重试次数
session.retry.count=3
# HTTP请求超时（秒）
session.request.timeout.seconds=15

# --- 日志 ---
logging.file=/var/log/oa-proxy/proxy.log
