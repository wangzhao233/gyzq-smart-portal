<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldAG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="50%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#b8912e"/>
    </linearGradient>
    <filter id="shadowA" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Rounded square base - white -->
  <rect x="14" y="14" width="172" height="172" rx="34" ry="34" fill="#ffffff" filter="url(#shadowA)"/>

  <!-- Blue outlined speech bubble (matching original WeCom style) -->
  <g transform="translate(100,93)">
    <!-- Bubble body - outline only, no fill -->
    <path d="M-60,-44 v-6 a10,10 0 0,1 10,-10 h100 a10,10 0 0,1 10,10 v70 a10,10 0 0,1 -10,10 h-80 l-22,20 v-20 h-8" 
          fill="none" stroke="#1478FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner gold element: simplified "信" oracle bone icon -->
    <g fill="none" stroke="url(#goldAG)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- 亻 (person) - left side -->
      <path d="M-14,-22 v24 c0,4 3,8 5,11"/>
      <path d="M-20,-12 c-3,-3 -1,-11 0,-14 c1,3 2,11 0,14"/>
      
      <!-- 言 (speech/words) - right side -->
      <line x1="-4" y1="-24" x2="22" y2="-24"/>
      <line x1="-7" y1="-14" x2="24" y2="-14"/>
      <line x1="-5" y1="-4" x2="22" y2="-4"/>
      <!-- 口 (mouth) -->
      <rect x="-2" y="6" width="20" height="16" rx="3"/>
    </g>
  </g>

  <!-- Top-right gold accent dot (subtle, like 私有案 badge but gold) -->
  <circle cx="150" cy="42" r="4" fill="url(#goldAG)" opacity="0.8"/>
</svg>
