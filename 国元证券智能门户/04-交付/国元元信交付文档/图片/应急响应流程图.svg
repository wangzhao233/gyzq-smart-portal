<svg viewBox="0 0 680 1070" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>应急响应流程图</title>
  <desc>国元元信应急响应11步完整流程：事件报警→确认信息→发送报告→小组响应→规划处置→先期处理→问题通报→扩大应急判断→处理完成→复盘报告→归档评审</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .box { rx:8; stroke-width:0.5; }
    .th { font-family:sans-serif; font-size:13px; font-weight:600; fill:#2C2C2A; }
    .ts { font-family:sans-serif; font-size:12px; font-weight:400; fill:#5F5E5A; }
    .tsm { font-family:sans-serif; font-size:11px; font-weight:400; fill:#888780; }
    .num { font-family:sans-serif; font-size:11px; font-weight:600; fill:#FFFFFF; text-anchor:middle; }
    .dec { font-family:sans-serif; font-size:11px; font-weight:600; fill:#2C2C2A; text-anchor:middle; }
  </style>

  <!-- ====== 步骤 1 ====== -->
  <rect class="box" x="80" y="20" width="520" height="48" fill="#E6F1FB" stroke="#378ADD"/>
  <circle cx="102" cy="44" r="12" fill="#378ADD"/>
  <text class="num" x="102" y="45">1</text>
  <text class="th" x="128" y="36">事件报警</text>
  <text class="ts" x="128" y="54">发现系统异常，立即报告应急小组</text>

  <line x1="340" y1="68" x2="340" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== 步骤 2 ====== -->
  <rect class="box" x="80" y="98" width="520" height="48" fill="#FFFFFF" stroke="#B4B2A9"/>
  <circle cx="102" cy="122" r="12" fill="#B4B2A9"/>
  <text class="num" x="102" y="123">2</text>
  <text class="th" x="128" y="114">确认应急信息及相关情况</text>
  <text class="ts" x="128" y="132">核实故障现象、影响范围、紧急程度</text>

  <line x1="340" y1="146" x2="340" y2="170" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== 步骤 3 ====== -->
  <rect class="box" x="80" y="176" width="520" height="48" fill="#FFFFFF" stroke="#B4B2A9"/>
  <circle cx="102" cy="200" r="12" fill="#B4B2A9"/>
  <text class="num" x="102" y="201">3</text>
  <text class="th" x="128" y="192">发送信息报告</text>
  <text class="ts" x="128" y="210">书面邮件发送事故信息，启动应急响应</text>

  <line x1="340" y1="224" x2="340" y2="248" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== 步骤 4 ====== -->
  <rect class="box" x="80" y="254" width="520" height="48" fill="#FFFFFF" stroke="#B4B2A9"/>
  <circle cx="102" cy="278" r="12" fill="#B4B2A9"/>
  <text class="num" x="102" y="279">4</text>
  <text class="th" x="128" y="270">应急工作小组应急响应</text>
  <text class="ts" x="128" y="288">成立事故应急处理小组（责任人+协调人+专家组）</text>

  <line x1="340" y1="302" x2="340" y2="326" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== 步骤 5 ====== -->
  <rect class="box" x="80" y="332" width="520" height="48" fill="#FFFFFF" stroke="#B4B2A9"/>
  <circle cx="102" cy="356" r="12" fill="#B4B2A9"/>
  <text class="num" x="102" y="357">5</text>
  <text class="th" x="128" y="348">规划处置办法</text>
  <text class="ts" x="128" y="366">分析事故原因、评估损失、制定修复方案</text>

  <line x1="340" y1="380" x2="340" y2="404" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== 步骤 6 ====== -->
  <rect class="box" x="80" y="410" width="520" height="48" fill="#FAEEDA" stroke="#BA7517"/>
  <circle cx="102" cy="434" r="12" fill="#BA7517"/>
  <text class="num" x="102" y="435">6</text>
  <text class="th" x="128" y="426">事故问题信息进行先期处理</text>
  <text class="ts" x="128" y="444">按修复方案进行事故修复，降低损失</text>

  <line x1="340" y1="458" x2="340" y2="482" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== 步骤 7 ====== -->
  <rect class="box" x="80" y="488" width="520" height="48" fill="#FFFFFF" stroke="#B4B2A9"/>
  <circle cx="102" cy="512" r="12" fill="#B4B2A9"/>
  <text class="num" x="102" y="513">7</text>
  <text class="th" x="128" y="504">告知问题信息进行通报</text>
  <text class="ts" x="128" y="522">按事故级别内部通报，并向客户方通报</text>

  <line x1="340" y1="536" x2="340" y2="560" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== 判断：扩大应急？ ====== -->
  <polygon points="340,566 420,608 340,650 260,608" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="dec" x="340" y="606">扩大应急？</text>
  <text class="tsm" x="340" y="622" text-anchor="middle">能否完全解决？</text>

  <!-- 否分支 → 步骤 8 -->
  <line x1="420" y1="608" x2="468" y2="608" stroke="#BA7517" stroke-width="1.5"/>
  <text class="tsm" x="446" y="598" text-anchor="middle" fill="#BA7517">否</text>
  <line x1="468" y1="608" x2="520" y2="608" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 步骤 8 -->
  <rect class="box" x="528" y="584" width="132" height="48" fill="#FAEEDA" stroke="#BA7517"/>
  <circle cx="542" cy="608" r="10" fill="#BA7517"/>
  <text class="num" x="542" y="609">8</text>
  <text class="ts" x="554" y="600" fill="#2C2C2A">扩大响应</text>
  <text class="tsm" x="554" y="618">扩大应急范围</text>

  <!-- 是分支 → 步骤 9 -->
  <line x1="340" y1="650" x2="340" y2="682" stroke="#639922" stroke-width="1.5"/>
  <text class="tsm" x="330" y="670" text-anchor="end" fill="#639922">是</text>
  <line x1="340" y1="682" x2="340" y2="710" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== 步骤 9 ====== -->
  <rect class="box" x="80" y="718" width="520" height="48" fill="#EAF3DE" stroke="#639922"/>
  <circle cx="102" cy="742" r="12" fill="#639922"/>
  <text class="num" x="102" y="743">9</text>
  <text class="th" x="128" y="734">处理应急风险问题完成</text>
  <text class="ts" x="128" y="752">应急问题处理完毕，确认系统恢复正常</text>

  <line x1="340" y1="766" x2="340" y2="792" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== 步骤 10 ====== -->
  <rect class="box" x="80" y="800" width="520" height="56" fill="#FFFFFF" stroke="#B4B2A9"/>
  <circle cx="102" cy="828" r="12" fill="#B4B2A9"/>
  <text class="num" x="102" y="829">10</text>
  <text class="th" x="128" y="818">提供应急报告及复盘报告会议</text>
  <text class="ts" x="128" y="838">应急结束</text>
  <text class="ts" x="128" y="850">开展应急复盘会议，出具系统事故报告</text>

  <line x1="340" y1="856" x2="340" y2="884" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== 步骤 11 ====== -->
  <rect class="box" x="80" y="892" width="520" height="48" fill="#E6F1FB" stroke="#378ADD"/>
  <circle cx="102" cy="916" r="12" fill="#378ADD"/>
  <text class="num" x="102" y="917">11</text>
  <text class="th" x="128" y="908">归档事故报告提供客户评审</text>
  <text class="ts" x="128" y="926">报告归档总结，客户签字确认</text>
</svg>
