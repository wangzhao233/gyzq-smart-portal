# ===========================================================
# OA新闻反向代理配置 — 智能门户 V2.1.6
# 部署位置：/etc/nginx/conf.d/oa-news-proxy.conf
# 作用：将门户 /oa-news/* 请求转发到本地 Python 代理服务
# ===========================================================

# 新闻代理 — 所有8个新闻分类
location /oa-news/ {
# 转发到本地代理服务（127.0.0.1:8899）
# 代理负责注入OA Cookie并转发到 home.oa.gyzq.com
    proxy_pass http://127.0.0.1:8899;

    # 基础代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 超时（SharePoint API响应通常在1-3秒内）
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 5s;

    # 缓冲
    proxy_buffering off;
    proxy_request_buffering off;

    # 错误处理：本地代理挂了时返回友好提示
    proxy_intercept_errors on;
    error_page 502 503 504 = @oa_proxy_down;
}

# 代理服务不可用时的降级响应
location @oa_proxy_down {
    default_type application/json;
    return 503 '{"error": "OA新闻服务暂不可用", "message": "请稍后刷新页面", "retry": true}';
}

# ===========================================================
# 新闻分类与接口对应说明（供运维参考）
# ===========================================================
# 门户数据源URL格式：
#   https://portal.oa.gyzq.com/oa-news/{分类路径}/_api/lists/getbytitle('页面')/items?...
#
# 示例（公司动态）：
#   https://portal.oa.gyzq.com/oa-news/gsdt/_api/lists/getbytitle('页面')/items?$select=Created,Title,Id,ArticleStartDate,FileRef,Modified&$top=20&$orderby=ArticleStartDate%20desc&$filter=OData__ModerationStatus%20eq%200
#
# 分类路径映射：
#   /oa-news/gsdt/  → 公司动态
#   /oa-news/bmjb/  → 部门简报
#   /oa-news/cxfz/  → 创新发展（监管动态子路径: /oa-news/hggl/jgdt/）
#   /oa-news/hggl/  → 合规管理
#   /oa-news/djqt/  → 党建群团
#   /oa-news/zgs/   → 子公司及分支机构
#   /oa-news/lxyz/  → 党建指南
#   /oa-news/fwt/   → 服务台
#   /oa-news/bmgg/  → 部门公告（搜索聚合）
# ===========================================================
