<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gdA1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="50%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#b8912e"/>
    </linearGradient>
    <filter id="sdA1">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00000018"/>
    </filter>
  </defs>

  <rect x="14" y="14" width="172" height="172" rx="34" ry="34" fill="#ffffff" filter="url(#sdA1)"/>

  <g transform="translate(100,92)">
    <!-- Blue outline bubble - same proportions as original WeCom -->
    <path d="M-58,-42 v-6 a9,9 0 0,1 9,-9 h98 a9,9 0 0,1 9,9 v68 a9,9 0 0,1 -9,9 h-78 l-20,18 v-18 h-8"
          fill="none" stroke="#1478FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inner element: geometric "信" mark -->
    <!-- Standing figure (亻) + speech bars (言) as clean geometric shapes -->
    <g fill="none" stroke="url(#gdA1)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- 亻: curved standing person -->
      <path d="M-12,-18 c0,0 0,12 0,18 c0,2 2,4 4,6"/>
      <path d="M-18,-12 c-2,-2 -1,-9 0,-12 c1,3 2,9 0,12"/>
      
      <!-- 言: horizontal bars + square -->
      <line x1="-2" y1="-20" x2="24" y2="-20"/>
      <line x1="-5" y1="-11" x2="26" y2="-11"/>
      <line x1="-3" y1="-2" x2="24" y2="-2"/>
      <rect x="0" y="7" width="20" height="15" rx="3"/>
    </g>
  </g>
</svg>
