<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="goldGradB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="40%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#b8912e"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(60,60)">
    <rect x="-35" y="-35" width="70" height="70" rx="15" fill="#0d2b45"/>

    <!-- Convergence lines -->
    <g stroke="url(#goldGradB2)" stroke-width="0.6" opacity="0.2">
      <line x1="-24" y1="-24" x2="0" y2="0"/>
      <line x1="24" y1="-24" x2="0" y2="0"/>
      <line x1="-24" y1="24" x2="0" y2="0"/>
      <line x1="24" y1="24" x2="0" y2="0"/>
      <line x1="-24" y1="0" x2="0" y2="0"/>
      <line x1="24" y1="0" x2="0" y2="0"/>
      <line x1="0" y1="-24" x2="0" y2="0"/>
      <line x1="0" y1="24" x2="0" y2="0"/>
    </g>

    <!-- Rings -->
    <circle cx="0" cy="0" r="20" fill="#0d2b45" stroke="url(#goldGradB2)" stroke-width="1.5"/>

    <!-- 信 -->
    <g fill="none" stroke="url(#goldGradB2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-8,-16 v16 c0,3 2,7 4,10"/>
      <path d="M-14,-8 c-2,-2 -1,-9 0,-12 c1,2 2,9 0,12"/>
      <line x1="-4" y1="-18" x2="14" y2="-18"/>
      <line x1="-6" y1="-11" x2="16" y2="-11"/>
      <line x1="-4" y1="-4" x2="14" y2="-4"/>
      <rect x="-2" y="4" width="14" height="12" rx="2"/>
    </g>
  </g>

  <g transform="translate(150,60)">
    <text x="0" y="5" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="700" fill="#0d2b45" letter-spacing="8">元信</text>
    <line x1="0" y1="22" x2="110" y2="22" stroke="url(#goldGradB2)" stroke-width="2"/>
    <text x="0" y="42" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#8899aa" letter-spacing="4">YUANXIN</text>
  </g>

  <g transform="translate(350,60)">
    <text x="0" y="-30" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8899aa" text-anchor="end">国元之心</text>
    <line x1="-72" y1="-22" x2="0" y2="-22" stroke="#c4a44a" stroke-width="0.6" opacity="0.5"/>
    <text x="0" y="-8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8899aa" text-anchor="end">融汇于信</text>
  </g>
</svg>
