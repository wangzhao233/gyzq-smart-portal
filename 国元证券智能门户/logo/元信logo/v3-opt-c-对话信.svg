<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gdC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="50%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#b8912e"/>
    </linearGradient>
    <filter id="sdC1">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00000018"/>
    </filter>
  </defs>

  <rect x="14" y="14" width="172" height="172" rx="34" ry="34" fill="#ffffff" filter="url(#sdC1)"/>

  <!-- Blue outline main bubble -->
  <g transform="translate(100,93)">
    <path d="M-58,-42 v-6 a9,9 0 0,1 9,-9 h98 a9,9 0 0,1 9,9 v68 a9,9 0 0,1 -9,9 h-78 l-20,18 v-18 h-8"
          fill="none" stroke="#1478FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inner: two overlapping smaller bubbles (对话意象) + gold accent -->
    <!-- Left small bubble (blue outline) -->
    <path d="M-34,-5 v-4 a6,6 0 0,1 6,-6 h28 a6,6 0 0,1 6,6 v20 a6,6 0 0,1 -6,6 h-20 l-10,8 v-8 h-4"
          fill="none" stroke="#1478FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

    <!-- Right small bubble (gold outline) -->
    <path d="M-4,-25 v-4 a6,6 0 0,1 6,-6 h28 a6,6 0 0,1 6,6 v20 a6,6 0 0,1 -6,6 h-20 l-10,8 v-8 h-4"
          fill="none" stroke="url(#gdC1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

    <!-- Center: gold "信" simplified -->
    <g transform="translate(0,2)">
      <!-- 人 stroke -->
      <g fill="none" stroke="url(#gdC1)" stroke-width="2.6" stroke-linecap="round">
        <path d="M-6,-12 v14"/>
        <path d="M-10,-8 L-6,-5 L-2,-8"/>
      </g>
      <!-- 言: speech bars -->
      <g fill="none" stroke="url(#gdC1)" stroke-width="2.2" stroke-linecap="round">
        <line x1="0" y1="-14" x2="16" y2="-14"/>
        <line x1="0" y1="-7" x2="14" y2="-7"/>
        <line x1="0" y1="0" x2="12" y2="0"/>
      </g>
    </g>
  </g>
</svg>
